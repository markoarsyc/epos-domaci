<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawgram | Registracija</title>
    <link rel="stylesheet" href="CSS/style.css" type="text/css">
    <link rel="stylesheet" href="CSS/registracija.css" type="text/css">
    <link rel="shortcut icon" href="media/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="burger">
        <img src="media/Hamburger_icon.svg.png" alt="burger" id="BURGER">
    </div>
    <nav>
        <div class="meni">
            <div class="meni-opcija">
                <a href="index.html">Početna</a>
            </div>
            <div class="meni-opcija">
                <a href="ljubimci.html">Ljubimci</a>
            </div>
            <div class="meni-opcija">
                <a href="prodavnica.html">Prodavnica</a>
            </div>
            <div class="meni-opcija">
                <a href="registracija.html">Registracija</a>
            </div>
        </div>
    </nav>
    <div class="glavni-sadrzaj">
        <div class="leva-strana">
            <div class="slika-i-opis">
                <img src="media/image 8.png" alt="registracija">
                <p>
                    <b>Prijavite se</b> na sledeću formu kako biste mogli da usvojite ljubimca ili obavite kupovinu.
                </p>
            </div>
        </div>
        <div class="desna-strana">
            <form>
                <h2>Registruj se</h2>
                <div class="polje">
                    <label for="IME">Ime i prezime:</label>
                    <input type="text" id="IME" required>
                </div>
                <div class="polje">
                    <label for="TELEFON">Kontakt telefon:</label>
                    <input type="text" id="TELEFON" required>
                </div>
                <div class="polje">
                    <label for="MAIL">Mail:</label>
                    <input type="email" id="MAIL" required>
                </div>
                <div class="polje">
                    <label for="GRAD">Grad:</label>
                    <input type="text" id="GRAD">
                </div>
                <div class="polje">
                   <label for="GRAD">Ulica i broj:</label>
                    <input type="text" id="ULICABROJ"> 
                </div>
                <div class="izbor">
                    <p>Razlog registracije:</p>
                    <br>
                    <input type="checkbox" id="LJUBIMAC" class="checkbox">
                    <label for="LJUBIMAC">Udomljavanje ljubimca</label>
                    <br>
                    <input type="checkbox" id="PRODAVNICA" class="checkbox">
                    <label for="PRODAVNICA">Online prodavnica</label>
                </div>
                <button type="submit">Registruj se</button>
            </form>
        </div>
    </div>
    <script src="Script/validacijaForme.js"></script>
</body>

</html>
